<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Line Schedule</title>
<style>
:root {
  --navy: #1f3864; --navy-2: #2e4a7d; --blue: #2e75b6; --ink: #1d2433; --muted: #6b7385; --line: #e4e8ef;
  --bg: #f3f5f9; --card: #ffffff; --cream: #fff8e1; --cream-ink: #7f6000;
  --run: #2e7d32; --part: #ed7d31; --ot: #e0a800; --ready: #7030a0; --pm: #0070c0; --ns: #8c8c8c;
  --run-t: #e2f0d9; --part-t: #fbe5d6; --ot-t: #fff2cc; --ready-t: #e4dfec; --pm-t: #ddebf7; --ns-t: #ededed;
  --s1: #2e7d32; --cnt: #b45309; --s3: #7030a0; --s4: #c00000; --cap: #c55a11;
  --hl-allergen: #fbe3d6; --hl-oil: #fff4cc; --hl-dump: #deebf7;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; cursor: pointer; }

/* ---- app bar ---- */
.bar { position: sticky; top: 0; z-index: 20; background: linear-gradient(120deg, var(--navy), var(--navy-2)); color: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,.18); }
.bar-in { max-width: 1480px; margin: 0 auto; padding: 14px 20px 0; }
.bar-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
.brand .date { color: #bcd0ee; font-size: 14px; }
.seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: #dbe6f7; padding: 6px 14px; border-radius: 999px; font-weight: 600;
  transition: background .2s, color .2s; }
.seg button.on { background: #fff; color: var(--navy); }
.asof { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 4px 6px 4px 14px; }
.asof label { font-size: 12px; color: #bcd0ee; text-transform: uppercase; letter-spacing: .6px; }
.asof input { border: 0; background: transparent; color: #fff; font: inherit; font-weight: 600; width: 112px; color-scheme: dark; }
.pill-btn { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; background: #fff; color: var(--navy);
  transition: transform .12s, box-shadow .2s; }
.pill-btn:hover { box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.pill-btn:active { transform: scale(.96); }
.pill-btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
.tabs { display: flex; gap: 4px; margin-top: 12px; position: relative; }
.tab { border: 0; background: transparent; color: #c9d7ee; padding: 10px 16px 12px; font-weight: 600; font-size: 14px; position: relative; }
.tab.on { color: #fff; }
.tab .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: rgba(255,255,255,.18);
  font-size: 12px; text-align: center; }
.tab-ink { position: absolute; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #8fb8ff; transition: left .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1); }

main { max-width: 1480px; margin: 0 auto; padding: 18px 20px 40px; }
.panel { display: none; }
.panel.on { display: block; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---- summary ---- */
.summary { display: grid; grid-template-columns: 2fr 1.3fr 1.1fr; gap: 14px; margin-bottom: 14px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat { padding: 14px 16px; }
.stat h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; }
.stat .big { font-size: 22px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.toolbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
.search { flex: 0 1 280px; display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 7px 14px; box-shadow: var(--shadow); }
.search input { border: 0; outline: 0; font: inherit; width: 100%; background: transparent; }
.toggle { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 600; color: var(--muted); transition: all .2s; }
.toggle.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.legend { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend b { color: var(--ink); font-weight: 700; margin-right: 2px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---- line cards ---- */
.lines { display: grid; gap: 12px; }
.lcard { display: grid; grid-template-columns: 190px 1fr; overflow: hidden; animation: rise .4s both; position: relative; }
.lcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); transition: background .3s; }
.lhead { padding: 14px 12px 14px 20px; background: var(--t); display: flex; flex-direction: column; gap: 8px; transition: background .3s; }
.lname { font-size: 18px; font-weight: 750; color: var(--c); letter-spacing: .2px; transition: color .3s; }
.stchip { border: 0; align-self: flex-start; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--c); color: #fff;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, background .3s; }
.stchip:hover { transform: translateY(-1px); }
.stchip .caret { font-size: 9px; opacity: .8; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.meta .nx { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-bottom: 2px; }
.lbody { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 1060px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; text-align: left; padding: 9px 8px 7px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: #fbfcfe; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
td.desc { white-space: normal; min-width: 220px; font-weight: 550; }
tr.wo { transition: background .25s; }
tr.wo:hover { background: #f6f9ff; }
tr.hl-allergen { background: var(--hl-allergen); } tr.hl-oil { background: var(--hl-oil); } tr.hl-dump { background: var(--hl-dump); }
tr.hl-allergen td:first-child { box-shadow: inset 3px 0 #e8956a; } tr.hl-oil td:first-child { box-shadow: inset 3px 0 #e6c045; }
tr.hl-dump td:first-child { box-shadow: inset 3px 0 #79a8d8; }
.grey td { color: #a3a9b5 !important; } .grey .cochip, .grey .bar-fill { filter: grayscale(1); opacity: .55; }
.cap-new { color: var(--cap); font-weight: 750; } .ct-new { color: #c00000; font-weight: 750; }
.allergen { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #f8cbad; color: #843c0c; font-weight: 700; font-size: 12px; }
tr.unote td:first-child { box-shadow: inset 3px 0 #2a9d8f; }
tr.unote td { background: #ddf5f1; color: #0f6e66; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid #b5e6de; }
tr.unote .arrow { color: #2a9d8f; padding-left: 14px; }
tr.unote b { font-weight: 700; }
td.nb { width: 34px; padding: 0 6px 0 0; text-align: right; }
.note-btn { border: 1px solid var(--line); background: #fff; color: #8a93a3; width: 26px; height: 26px; border-radius: 8px; font-size: 13px; opacity: .55;
  transition: all .15s; }
tr.wo:hover .note-btn, .note-btn:focus { opacity: 1; }
.note-btn:hover { color: #0f6e66; border-color: #8fd3c8; background: #eefaf8; }
.note-btn.has { opacity: 1; background: #ddf5f1; border-color: #8fd3c8; color: #0f6e66; }
.note-add { border: 1px dashed #8fd3c8; background: #fff; color: #0f6e66; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 650;
  align-self: flex-start; transition: background .15s; }
.note-add:hover { background: #eefaf8; }
.modal-bg { position: fixed; inset: 0; background: rgba(16, 24, 40, .35); z-index: 80; display: grid; place-items: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(16,24,40,.3); width: min(520px, calc(100vw - 32px)); padding: 18px;
  animation: pop .18s cubic-bezier(.2,.8,.2,1); }
.modal h3 { margin: 0 0 4px; font-size: 16px; } .modal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.modal textarea { width: 100%; min-height: 110px; border: 1px solid #b5e6de; background: #f5fcfb; border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; outline: none; }
.modal textarea:focus { border-color: #2a9d8f; box-shadow: 0 0 0 3px #ddf5f1; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.modal .row button { border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 650; }
.modal .save { background: #2e75b6; color: #fff; } .modal .cancel { background: #eef1f6; color: var(--ink); } .modal .del { background: #fde8e8; color: #b42318; margin-right: auto; }
tr.note td { background: var(--cream); color: var(--cream-ink); font-size: 12px; font-style: italic; padding: 4px 8px; border-bottom: 1px solid #f3e7bf; }
tr.note .arrow { font-style: normal; color: #b39540; padding-left: 14px; }
tr.note b { font-style: normal; font-weight: 700; }

.prog { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.bar-track { flex: 1; height: 8px; background: #e7ecf3; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #43a047, #2e7d32); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.prog b { font-size: 12.5px; color: var(--run); min-width: 34px; text-align: right; }
.nostart { color: var(--muted); font-style: italic; }
.cochip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.intl { display: inline-block; padding: 0 6px; border-radius: 5px; border: 1.5px solid var(--navy); color: var(--navy); font-size: 10.5px; font-weight: 800; letter-spacing: .4px; }
.est { font-weight: 650; } .est.first { color: var(--navy); font-weight: 750; } .est.dim { color: var(--muted); font-style: italic; font-weight: 500; }

/* ---- popover, toast ---- */
.pop { position: absolute; z-index: 50; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(16,24,40,.22); padding: 8px; display: grid; gap: 4px;
  transform-origin: top left; animation: pop .16s cubic-bezier(.2,.8,.2,1); min-width: 190px; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.pop h4 { margin: 4px 8px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.opt { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.opt:hover { background: #f1f4f9; }
.opt .dot { width: 10px; height: 10px; border-radius: 50%; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 18px;
  border-radius: 999px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.25); transition: all .3s cubic-bezier(.2,.8,.2,1); z-index: 60; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- lines tab ---- */
.lt-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.act { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 650; background: var(--blue); color: #fff; box-shadow: var(--shadow); transition: transform .12s, filter .2s; }
.act:hover { filter: brightness(1.08); } .act:active { transform: scale(.97); } .act.go { background: var(--run); } .act.off { background: #8c8c8c; }
.lt { display: grid; gap: 10px; }
.lt-row { display: grid; grid-template-columns: 130px 70px 1fr 1fr 120px 90px; align-items: center; gap: 14px; padding: 12px 16px; animation: rise .35s both; }
.lt-row .nm { font-weight: 750; font-size: 16px; }
.lt-row .wo { color: var(--muted); font-size: 12px; }
.lt-row.lt-head { padding: 0 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700;
  animation: none; background: none; box-shadow: none; }
.stpick { display: flex; flex-wrap: wrap; gap: 5px; }
.stpick button { border: 1.5px solid var(--c); background: #fff; color: var(--c); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700;
  transition: all .18s; }
.stpick button.on { background: var(--c); color: #fff; transform: scale(1.04); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { border: 0; background: #f4f6fa; width: 30px; height: 30px; font-size: 16px; font-weight: 700; color: var(--navy); }
.stepper span { min-width: 34px; text-align: center; font-weight: 700; }
.switch { width: 44px; height: 24px; border-radius: 999px; border: 0; background: #cfd6e2; position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch.on { background: var(--run); } .switch.on::after { left: 23px; }

/* ---- washroom ---- */
.wash-top { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.wlist { display: grid; gap: 10px; }
.witem { display: grid; grid-template-columns: 44px 120px 120px 1fr 1fr 70px; align-items: center; gap: 14px; padding: 12px 16px; animation: rise .35s both;
  transition: opacity .3s, transform .3s; }
.witem.done { opacity: .5; }
.witem.done .parts { text-decoration: line-through; }
.check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid #b8c2d3; background: #fff; display: grid; place-items: center; transition: all .2s; }
.check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .3s .05s; }
.witem.done .check { background: var(--run); border-color: var(--run); } .witem.done .check svg { stroke-dashoffset: 0; }
.wtime { font-weight: 750; color: var(--navy); } .wline { font-weight: 700; }
.parts small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.type { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; margin-top: 3px; }
.type.oily { background: #fff2cc; color: #7f6000; } .type.powdery { background: #ededed; color: #595959; }
.filler { font-size: 12px; font-weight: 700; } .filler.cremer { color: #1f6f8b; } .filler.merrill { color: #7b3f00; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
footer { max-width: 1480px; margin: 0 auto; padding: 0 20px 30px; color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .summary { grid-template-columns: 1fr; }
  .lcard { grid-template-columns: 1fr; }
  .lt-row { grid-template-columns: 1fr 1fr; } .lt-head { display: none; }
  .witem { grid-template-columns: 44px 1fr 1fr; }
  .legend { margin-left: 0; }
}
/* ---- the printouts, laid out like the workbook's 4. Schedule and 7. Washroom (hidden on screen) ---- */
.print-only { display: none; }
.xs { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 7.6pt; color: #262626; }
.xs table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.xs td { padding: 0 3px; height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid #d9d9d9;
  border-bottom: 1px solid #d9d9d9; vertical-align: middle; }
.xs td { box-shadow: none !important; }
.xs .band1 td, .xs .band2 td, .xs .band3 td { border: 0 !important; }
.xs .band1 td { background: #1f3864; color: #fff; height: 30px; }
.xs .band1 .t { font-size: 15pt; font-weight: 700; padding-left: 8px; }
.xs .band2 td { background: #ddebf7; height: 17px; border: 0; }
.xs .band3 td { background: #fff; height: 17px; border: 0; }
.xs .lg { text-align: right; padding-right: 8px; font-size: 7.2pt; }
.xs .lg b { margin-left: 8px; } .xs .lg .sq { display: inline-block; width: 7px; height: 7px; margin: 0 2px 0 7px; vertical-align: 0; }
.xs .heads td { background: #2e75b6; color: #fff; font-weight: 700; text-align: center; height: 26px; white-space: normal; line-height: 1.1;
  border-left: 1px solid #fff; border-bottom: 1px solid #1f3864; font-size: 7.4pt; }
.xs .gap td { border: 0; height: 9px; background: #fff; }
.xs td.ln { background: var(--t); color: var(--c); font-weight: 700; text-align: center; vertical-align: top; font-size: 8.4pt; line-height: 15px; padding-top: 0; }
.xs td.ln span { display: block; } .xs td.ln small { display: block; font-size: 8.2pt; font-weight: 700; }
.xs tbody.box > tr > td:first-child { border-left: 1.6px solid var(--c); }
.xs tbody.box > tr > td:last-child { border-right: 1.6px solid var(--c); }
.xs tbody.box > tr:first-child > td { border-top: 1.6px solid var(--c); }
.xs tbody.box > tr:last-child > td { border-bottom: 1.6px solid var(--c); }
.xs td.ln { border-bottom: 1.6px solid var(--c) !important; }
.xs .r { text-align: right; } .xs .c { text-align: center; }
.xs .seg { color: var(--run); letter-spacing: -.5px; font-size: 7pt; } .xs .pct { color: var(--run); font-weight: 700; margin-left: 4px; }
.xs tr.n td { height: 11px; font-size: 6.5pt; font-style: italic; color: #7f6000; }
.xs tr.n td.nt { background: #fff8e1; }
.xs tr.n td.nt.un { background: #ddf5f1; color: #0f6e66; font-style: normal; box-shadow: inset 3px 0 #2a9d8f !important; }
.xs tr.n td.ln { font-size: 8.4pt; font-style: normal; color: var(--c); height: auto; }
.xs tr.n td.arr { text-align: center; font-style: normal; color: #7f6000; font-size: 7pt; }
.xs .chipx { display: block; margin: 0 -3px; text-align: center; font-weight: 700; line-height: 15px; }
.xs tr.hl-allergen td.d { background: #f8cbad; } .xs tr.hl-oil td.d { background: #fff2cc; } .xs tr.hl-dump td.d { background: #bdd7ee; }
.xs tr.g td.d, .xs tr.g td.d * { color: #a6a6a6 !important; font-weight: 400 !important; }
.xs .intlx { font-weight: 700; }
.xs .foot { text-align: center; font-size: 7pt; color: #595959; margin-top: 6px; }
.xs .wt td { height: 22px; font-size: 8pt; }
.xs .wt td.ty-o { background: #fff2cc; color: #7f6000; font-weight: 700; text-align: center; }
.xs .wt td.ty-p { background: #ededed; color: #595959; font-weight: 700; text-align: center; }
.xs .wt td.al { background: #f8cbad; color: #843c0c; font-weight: 700; text-align: center; }
.xs .done { font-size: 13pt; color: #404040; text-align: center; }
/* ---- the modern printout: white, light on ink, its own look ---- */
.mp { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #1d2433; font-size: 7.2pt; }
.mp-top { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 8px; border-bottom: 2.5px solid #1f3864; }
.mp-eyebrow { font-size: 7.4pt; font-weight: 800; letter-spacing: 2.2px; color: #2e75b6; text-transform: uppercase; }
.mp-title { font-size: 18pt; font-weight: 800; color: #1f3864; line-height: 1.05; margin-top: 2px; }
.mp-date { font-size: 9pt; color: #6b7385; margin-top: 3px; }
.mp-asof { text-align: right; }
.mp-asof small { display: block; font-size: 6.8pt; letter-spacing: 1.6px; color: #6b7385; font-weight: 700; }
.mp-asof b { font-size: 15pt; color: #1f3864; }
.mp-asof span { display: block; font-size: 6.8pt; color: #9aa1ae; margin-top: 2px; }

  const oily = d => SET.oily.some(w => (" " + d.replace(/[-,()]/g, " ") + " ").includes(" " + w + " "));
  const list = S.lines.flatMap(l => l.running ? l.rows.map((r, i) => ({ r, p: l.rows[i - 1], l })).filter(x => x.r.inShift) : []).sort((a, b) => a.r.coStart - b.r.coStart);
  const WW = [4, 13, 9, 9, 17, 7, 36, 9, 10, 36, 9, 7];
  const WH = ["#", "TIME", "LINE", "FILLER", "CHANGEOVER", "MIN", "OFF THE LINE - PARTS TO WASH", "TYPE", "ALLERGEN", "NEXT ON THE LINE", "TYPE", "DONE"];
  const al = list.filter(x => x.p.allergen !== "N").length, cr = list.filter(x => SET.cremer.includes(num(x.l.name))).length, me = list.filter(x => SET.merrill.includes(num(x.l.name))).length;
  $("#print-wash").innerHTML = `<table><colgroup>${WW.map(w => `<col style="width:${w}%">`).join("")}</colgroup><thead>
    <tr class="band1"><td colspan="12" class="t">Washroom Prep List &nbsp;·&nbsp; ${SHIFTS[state.shift]}</td></tr>
    <tr class="band2"><td colspan="12" style="color:#1f3864;font-weight:700;font-style:italic;padding-left:8px">Changeovers expected from today ${tm(S.asof)} to today ${end} (the end of the shift), first to last (Schedule as of on 3. Lines; the times from 4. Schedule)</td></tr>
    <tr class="band3"><td colspan="12" style="font-weight:700;padding-left:8px">${list.length} changeovers &nbsp;|&nbsp; Oily parts: ${list.filter(x => oily(x.p.desc)).length} · Powdery parts: ${list.filter(x => !oily(x.p.desc)).length} &nbsp;|&nbsp; Allergen: ${al} &nbsp;|&nbsp; Cremer: ${cr} · Merrill: ${me}</td></tr>
    <tr class="heads">${WH.map(h => `<td>${h}</td>`).join("")}</tr></thead><tbody class="wt">`
    + list.map(({ r, p, l }, i) => {
      const n = num(l.name), fl = SET.cremer.includes(n) ? ["Cremer", "#1f6f8b"] : SET.merrill.includes(n) ? ["Merrill", "#7b3f00"] : ["", ""];
      const ty = d => oily(d) ? `<td class="ty-o">Oily</td>` : `<td class="ty-p">Powdery</td>`;
      return `<tr><td class="c"><b>${i + 1}</b></td><td>${fmtTime(r.coStart, S.asof)}</td><td><b>${l.name}</b></td><td class="c" style="color:${fl[1]};font-weight:700">${fl[0]}</td>
        <td><b style="color:var(${CO[r.code][1]})">${CO[r.code][0]}${r.intl ? " · INTL" : ""}</b></td><td class="c"><b>${CO[r.code][2]} min</b></td>
        <td>${p.item} &nbsp; ${p.desc}</td>${ty(p.desc)}${p.allergen !== "N" ? `<td class="al">${p.allergen}</td>` : "<td></td>"}<td>${r.item} &nbsp; ${r.desc}</td>${ty(r.desc)}<td class="done">☐</td></tr>`;
    }).join("") + `</tbody></table><div class="foot">Page 1 of 1</div>`;
}

// ---- the modern printouts ----
function renderModern(S) {
  const tm = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const end = tm(S.end), now = new Date();
  const day = new Date(S.asof).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const withWo = S.lines.filter(l => l.rows.length);
  const cos = S.lines.flatMap(l => l.running ? l.rows.filter(r => r.inShift).map(r => ({ ...r, ln: l.name })) : []);
  const minor = cos.filter(r => r.code === "S1" || r.code === "CNT").length;
  const next = cos.slice().sort((a, b) => a.coStart - b.coStart)[0];
  const ink = st => `var(${color(st)})`;
  const pretty = st => st === "PM / CLEANING" ? "PM / Cleaning" : st.charAt(0) + st.slice(1).toLowerCase();
  const top = (eyebrow, title) => `<div class="mp-top"><div><div class="mp-eyebrow">${eyebrow}</div><div class="mp-title">${title}</div>
      <div class="mp-date">${day}</div></div>
    <div class="mp-asof"><small>SCHEDULE AS OF</small><b>${tm(S.asof)}</b><span>Printed ${now.toLocaleDateString([], { month: "numeric", day: "numeric" })} ${tm(now)}</span></div></div>`;
  const kpis = `<div class="mp-kpis">
    <div class="mp-kpi"><small>${withWo.length} lines today</small>${STATUSES.map(([st]) => [st, withWo.filter(l => l.st === st).length]).filter(x => x[1])
      .map(([st, n]) => `<span class="st"><i class="mp-dot" style="background:${ink(st)}"></i>${n} ${pretty(st).toLowerCase()}</span>`).join("")}</div>
    <div class="mp-kpi"><small>Running</small><b>${withWo.filter(l => l.running).length}</b> <span style="color:#6b7385">of ${withWo.length}</span></div>
    <div class="mp-kpi"><small>Changeovers before ${end}</small><b>${minor}</b> <span style="color:#2e7d32;font-weight:700">minor</span> &nbsp;<b>${cos.length - minor}</b> <span style="color:#c00000;font-weight:700">major</span></div>
    <div class="mp-kpi"><small>Next changeover</small><b>${next ? next.ln : "—"}</b> ${next ? `<span style="color:#6b7385">· ${tm(next.coStart)}</span>` : ""}</div></div>`;
  // one box per line: its header bar, its own column titles, its work orders
  const cols = [["WO", 6.4], ["Seq", 3.2], ["Item", 6], ["Description", 15.6], ["Count", 4], ["Bulk", 6.8], ["Bottle", 4.4], ["Cap", 5.4], ["Allergen", 5.2],
    ["Desiccant", 6.6], ["WO qty", 5.6], ["Progress / changeover", 12.6], ["Left / C.O.", 6.6], ["Est. time", 11.6]];
  const al = i => [1, 4, 6, 7, 8, 9].includes(i) ? "c" : [10, 12, 13].includes(i) ? "r" : "";
  const colg = `<colgroup>${cols.map(([, w]) => `<col style="width:${w}%">`).join("")}</colgroup>`;
  const thr = `<tr class="th">${cols.map(([h], i) => `<td class="${al(i)}">${h}</td>`).join("")}</tr>`;
  // a status as a colored dot and its name (readable inks: gold and orange darker)
  const INK2 = { "RUNNING": "#2e7d32", "PARTIAL SHIFT": "#c55a11", "OVERTIME": "#9c6500", "READY LINE": "#7030a0", "PM / CLEANING": "#0070c0", "NOT SCHEDULED": "#6e6e6e" };
  const stv = st => `<span class="val" style="color:${INK2[st]}"><i style="background:${ink(st)}"></i>${pretty(st)}</span>`;
  const pill = st => `<span class="pill" style="background:${ink(st)};color:${st === "OVERTIME" ? "#1d2433" : "#fff"}">${st}</span>`;
  const boxes = withWo.map(l => {
    const rows = l.rows.map((r, i) => {
      const prog = r.first ? (r.pct > 0 ? `<span class="bar"><i style="width:${r.pct}%"></i></span><span class="pct">${Math.round(r.pct)}%</span>` : `<span class="muted">Not started yet</span>`)
        : `<b style="color:var(${CO[r.code][1]})">${CO[r.code][0]}</b>${r.intl ? '<span class="intl">INTL</span>' : ""}`;
      const est = !l.running ? "" : r.est ? `<b class="${r.first ? "first-est" : ""}">${fmtTime(r.est, S.asof)}</b>` : r.noRate ? `<span class="muted">no rate</span>` : "—";
      const left = r.first ? `<b style="color:#2e7d32">${k(r.left)}</b>` : `<b style="color:var(${CO[r.code][1]})">${CO[r.code][2]} min</b>`;
      let tr = `<tr class="wo ${i % 2 ? "alt" : ""} ${!l.grey && r.hl ? "hl-" + r.hl : ""}"><td><b>${r.wo}</b></td><td class="c">${r.seq}</td><td>${r.item}</td>
        <td class="desc2">${r.desc}</td><td class="c ${r.code === "CNT" ? "newct" : ""}">${r.ct}</td><td>${r.bulk}</td><td class="c">${r.btl}</td>
        <td class="c ${r.capNew ? "new" : ""}">${capCode(r.cap)}</td><td class="c">${r.allergen === "N" ? "N" : `<b class="alg">${r.allergen}</b>`}</td><td class="c">${r.des}</td>
        <td class="r">${r.qty.toLocaleString()}</td><td>${prog}</td><td class="r">${left}</td><td class="r">${est}</td></tr>`;
      if (!l.grey && r.inShift && r.coParts && r.coParts.length) tr += `<tr class="n"><td class="arr">↳</td><td colspan="13"><b>Changeover notes:</b> ${r.coParts.join(", ")}</td></tr>`;
      if (r.remarks) tr += `<tr class="n"><td class="arr">↳</td><td colspan="13"><b>Remarks:</b> ${r.remarks}</td></tr>`;
      if (noteOf("wo", r.wo)) tr += `<tr class="n un"><td class="arr">↳</td><td colspan="13"><b>Note:</b> ${esc(noteOf("wo", r.wo))}</td></tr>`;
      return tr;
    }).join("");
    const lineNote = noteOf("line", l.name) ? `<tr class="n un"><td colspan="14"><b>Line note:</b> ${esc(noteOf("line", l.name))}</td></tr>` : "";
    // the line on the left (like the LINE column), its work orders on the right
    return `<div class="mbox side ${l.grey ? "grey" : ""}" style="--c:${ink(l.st)};--t:var(${tint(l.st)})">
      <div class="mside"><div class="nm" style="color:${INK2[l.st]}">${l.name}</div>
        <div class="srow"><span class="lab">Next shift</span>${stv(l.nx)}</div></div>
      <table>${colg}<tbody>${lineNote}${rows}</tbody></table></div>`;
  }).join("");
  const key = `<div class="mkey"><b>Key</b>
    <span>Line color = this shift: ${STATUSES.map(([st]) => `<span class="sw" style="background:var(${tint(st)});border:1.5px solid ${ink(st)}"></span><span style="color:${INK2[st]};font-weight:700">${pretty(st)}</span>`).join(" ")}</span>
    <span><b style="color:var(--s1)">Minor · S1</b> <b style="color:var(--cnt)">Minor · Count</b> <b style="color:var(--s3)">MAJOR · S3</b> <b style="color:var(--s4)">MAJOR · S4</b> <span class="intl">INTL</span> international</span>
    <span><span class="sw" style="background:#fbe3d6"></span>Allergen <span class="sw" style="background:#fff1c2"></span>Oil <span class="sw" style="background:#ddebf7"></span>Dumping</span>
    <span><b class="new">Cap</b> new cap · <b class="newct">CT</b> new count</span>
    <span><span class="sw" style="background:#fff8e1;border:1px solid #e9d9a2"></span>Changeover notes / remarks <span class="sw" style="background:#ddf5f1;border:1px solid #8fd3c8"></span>Your notes</span></div>`;
  // one compact band on top: the title, the day's numbers, the as-of time
  const band = `<div class="mband"><div><div class="mp-eyebrow">Production Line Schedule</div><div class="mt">${SHIFTS[state.shift]}</div><div class="md">${day}</div></div>
    <div class="mnums"><div><small>${withWo.length} lines</small>${STATUSES.map(([st]) => [st, withWo.filter(l => l.st === st).length]).filter(x => x[1])
      .map(([st, n]) => `<span class="st"><i class="mp-dot" style="background:${ink(st)}"></i>${n} ${pretty(st).toLowerCase()}</span>`).join("")}</div>
      <div><small>Changeovers before ${end}</small><b>${minor}</b> <span style="color:#2e7d32;font-weight:700">minor</span> &nbsp;<b>${cos.length - minor}</b> <span style="color:#c00000;font-weight:700">major</span></div>
      <div><small>Next changeover</small><b>${next ? next.ln : "—"}</b>${next ? ` <span style="color:#6b7385">${tm(next.coStart)}</span>` : ""}</div></div>
    <div class="mp-asof"><small>SCHEDULE AS OF</small><b>${tm(S.asof)}</b><span>Printed ${now.toLocaleDateString([], { month: "numeric", day: "numeric" })} ${tm(now)}</span></div></div>`;
  // the column titles once, above the first line, lined up with every box
  const heads = `<div class="mbox side mheads"><div class="mside" style="background:#e9eff8"><b style="color:#1f3864;font-size:7pt">Line</b></div><table>${colg}<tbody>${thr}</tbody></table></div>`;
  $("#mprint-sched").innerHTML = band + heads + boxes + key
    + `<div class="mp-foot"><span>Estimated times from the line rates, breaks and changeover minutes</span><span>Production Line Schedule · ${SHIFTS[state.shift]}</span></div>`;
  fitOnePage($("#mprint-sched"));
  // the washroom checklist
  const oily = d => SET.oily.some(w => (" " + d.replace(/[-,()]/g, " ") + " ").includes(" " + w + " "));
  const list = S.lines.flatMap(l => l.running ? l.rows.map((r, i) => ({ r, p: l.rows[i - 1], l })).filter(x => x.r.inShift) : []).sort((a, b) => a.r.coStart - b.r.coStart);
  const ty = d => oily(d) ? `<span class="tp o">OILY</span>` : `<span class="tp p">POWDERY</span>`;
  const wk = `<div class="mp-kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="mp-kpi"><small>Changeovers until ${end}</small><b>${list.length}</b></div>
    <div class="mp-kpi"><small>Oily / powdery parts</small><b>${list.filter(x => oily(x.p.desc)).length}</b> <span style="color:#6b7385">oily</span> &nbsp;<b>${list.filter(x => !oily(x.p.desc)).length}</b> <span style="color:#6b7385">powdery</span></div>
    <div class="mp-kpi"><small>Allergen washes</small><b>${list.filter(x => x.p.allergen !== "N").length}</b></div>
    <div class="mp-kpi"><small>Cremer / Merrill</small><b>${list.filter(x => SET.cremer.includes(num(x.l.name))).length}</b> <span style="color:#6b7385">Cremer</span> &nbsp;<b>${list.filter(x => SET.merrill.includes(num(x.l.name))).length}</b> <span style="color:#6b7385">Merrill</span></div></div>`;
  $("#mprint-wash").innerHTML = top("Washroom Prep List", SHIFTS[state.shift]) + wk
    + `<table class="wt"><colgroup><col style="width:5%"><col style="width:11%"><col style="width:11%"><col style="width:15%"><col style="width:27%"><col style="width:4%"><col style="width:27%"></colgroup>
      <thead><tr><th class="c">Done</th><th>Time</th><th>Line</th><th>Changeover</th><th>Off the line - parts to wash</th><th></th><th>Next on the line</th></tr></thead><tbody>`
    + list.map(({ r, p, l }) => {
      const n = num(l.name), fl = SET.cremer.includes(n) ? "Cremer" : SET.merrill.includes(n) ? "Merrill" : "";
      return `<tr><td class="c"><span class="chk"></span></td><td><span class="tm">${tm(r.coStart)}</span></td>
        <td><b>${l.name}</b><small>${fl}</small></td>
        <td><span class="co ${r.code === "S1" || r.code === "CNT" ? "minor" : ""}" style="color:var(${CO[r.code][1]})">${CO[r.code][0]}</span>${r.intl ? '<span class="intl">INTL</span>' : ""}<small>${CO[r.code][2]} min</small></td>
        <td>${p.item} &nbsp;${p.desc}<br>${ty(p.desc)}${p.allergen !== "N" ? `<span class="tp" style="background:#fbe3d6;color:#9c3d10">ALLERGEN · ${p.allergen}</span>` : ""}</td>
        <td class="arrow">→</td><td>${r.item} &nbsp;${r.desc}<br>${ty(r.desc)}</td></tr>`;
    }).join("") + `</tbody></table><div class="mp-foot"><span>Tick each changeover when its parts are washed</span><span>Washroom Prep List · ${SHIFTS[state.shift]}</span></div>`;
  fitOnePage($("#mprint-wash"));
}

// Fit a printout to one page (like Excel's Fit to 1 page): letter landscape
// with 0.35 in margins is 988 x 748 CSS pixels; find the largest zoom (at
// most 100%) at which it is one page tall
function fitOnePage(el, pageW = 988, pageH = 744) {
  const keep = el.getAttribute("style") || "";
  el.style.cssText = `display:block;position:absolute;left:-20000px;top:0;width:${pageW}px;visibility:hidden;zoom:1`;
  const tall = z => { el.style.zoom = z; return el.getBoundingClientRect().height; };
  let lo = 0.45, hi = 1;
  if (tall(1) > pageH) { for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (tall(m) <= pageH) lo = m; else hi = m; } } else lo = 1;
  el.setAttribute("style", keep);
  el.style.zoom = lo;
  return lo;
}

// ---- the note editor ----
function openNote(kind, key) {
  const old = noteOf(kind, key);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-label="Note"><h3>${kind === "wo" ? "Note for WO " + esc(key) : "Note for " + esc(key)}</h3>
    <p>Shows in light teal under the ${kind === "wo" ? "work order" : "line"}, on screen and on the printout.</p>
    <textarea id="note-text" placeholder="Type a note...">${esc(old)}</textarea>
    <div class="row">${old ? '<button class="del">Delete note</button>' : ""}<button class="cancel">Cancel</button><button class="save">Save note</button></div></div>`;
  document.body.appendChild(bg);
  const ta = bg.querySelector("textarea"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const close = () => bg.remove();
  const set = v => {
    state.notes = state.notes || { wo: {}, line: {} }; state.notes[kind] = state.notes[kind] || {};
    if (v) state.notes[kind][key] = v; else delete state.notes[kind][key];
    save(); close(); render(); toast(v ? "Note saved" : "Note deleted");
  };
  bg.addEventListener("click", e => {
    if (e.target === bg || e.target.classList.contains("cancel")) close();
    else if (e.target.classList.contains("save")) set(ta.value.trim());
    else if (e.target.classList.contains("del")) set("");
    e.stopPropagation();
  });
  bg.addEventListener("keydown", e => { if (e.key === "Escape") close(); if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) set(ta.value.trim()); });
}

// ---- interaction ----
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }
function setLine(name, f, v) { state.lines[name][f] = v; save(); render(); toast(`${name} · ${f === "st" ? "this shift" : "next shift"}: ${v}`); }
function closePop() { document.querySelectorAll(".pop").forEach(p => p.remove()); }
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!e.target.closest(".pop")) closePop();
  if (!b) return;
  if (b.classList.contains("tab")) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
    moveInk(); render(); return;
  }
  if (b.dataset.s != null && b.parentElement.id === "shifts") { state.shift = +b.dataset.s; save(); render(); toast(SHIFTS[state.shift]); return; }
  if (b.classList.contains("stchip")) {
    const r = b.getBoundingClientRect(), pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `<h4>${b.dataset.line} · this shift</h4>` + STATUSES.map(([st, c]) => `<button class="opt" data-line="${b.dataset.line}" data-f="st" data-v="${st}"><span class="dot" style="background:var(${c})"></span>${st}</button>`).join("");
    document.body.appendChild(pop);
    // below the chip, or above it when there is no room below
    const h = pop.offsetHeight, below = r.bottom + 6 + h <= innerHeight;
    pop.style.left = (r.left + scrollX) + "px";
    pop.style.top = ((below ? r.bottom + 6 : r.top - 6 - h) + scrollY) + "px";
    pop.style.transformOrigin = below ? "top left" : "bottom left";
    e.stopPropagation(); return;
  }
  if (b.dataset.note) { openNote(b.dataset.note, b.dataset.key); return; }
  if (b.dataset.v) { closePop(); setLine(b.dataset.line, b.dataset.f, b.dataset.v); return; }
  if (b.dataset.crew) { const L = state.lines[b.dataset.line]; L.crew = Math.max(0, (L.crew || 0) + +b.dataset.crew) || null; save(); render(); return; }
  if (b.dataset.brk) { const L = state.lines[b.dataset.line]; L.breaks = !L.breaks; save(); render(); toast(`${b.dataset.line}: ${L.breaks ? "stops" : "runs through"} breaks and lunch`); return; }
  if (b.dataset.done) { state.done[b.dataset.done] = !state.done[b.dataset.done]; save(); b.closest(".witem").classList.toggle("done"); renderWashTop(); return; }
  if (b.id === "ps-modern" || b.id === "ps-classic") {
    document.body.dataset.style = b.id === "ps-modern" ? "modern" : "classic";
    $("#ps-modern").classList.toggle("on", b.id === "ps-modern"); $("#ps-classic").classList.toggle("on", b.id === "ps-classic");
    toast((b.id === "ps-modern" ? "Modern" : "Classic") + " print"); return;
  }
  if (b.id === "t-run" || b.id === "t-notes") { b.classList.toggle("on"); renderLines(build()); return; }
  if (b.id === "now") { const d = new Date(); d.setSeconds(0, 0); state.asof = d.getTime(); save(); render(); toast("As of now"); return; }
  // Print: the washroom list from the Washroom tab, else the schedule
  if (b.id === "print") { document.body.dataset.print = $(".tab.on").dataset.p === "wash" ? "wash" : "sched"; const S = build(); renderPrint(S); renderModern(S); window.print(); return; }
  if (b.id === "a-run") { const S = build(); let n = 0; S.lines.forEach(l => { if (l.rows.length && !RUN.includes(l.st)) { state.lines[l.name].st = "RUNNING"; n++; } }); save(); render(); toast(n ? `${n} line(s) set RUNNING` : "Every line with work orders is already running"); return; }
  if (b.id === "a-next") { Object.values(state.lines).forEach(L => L.nx = L.st); save(); render(); toast("Next shift = this shift"); return; }
  if (b.id === "a-reset") { const s = fresh(); s.asof = state.asof; s.shift = state.shift; state = s; save(); render(); toast("Back to the mock-up"); return; }
});
function renderWashTop() { renderWash(build(), true); }
$("#q").addEventListener("input", () => renderLines(build()));
$("#asof").addEventListener("change", e => { const [h, m] = e.target.value.split(":").map(Number); const d = new Date(state.asof); d.setHours(h, m, 0, 0); state.asof = d.getTime(); save(); render(); });
function moveInk() { const on = $(".tab.on"), ink = $("#ink"); ink.style.left = on.offsetLeft + 12 + "px"; ink.style.width = on.offsetWidth - 24 + "px"; }
window.addEventListener("resize", moveInk);
document.body.dataset.print = "sched";
document.body.dataset.style = "modern";
window.addEventListener("beforeprint", () => { const S = build(); renderPrint(S); renderModern(S); });
render(); moveInk();
</script>
